[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
name = "apt-changelog-viewer"
version = "0.1.7"
description = "GTK4 changelog viewer with highlighted CVE and Debian/Ubuntu security advisory references"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Daniel Nylander", email = "daniel@danielnylander.se"}]

[project.scripts]
apt-changelog-viewer = "apt_changelog_viewer.main:main"

[tool.setuptools.packages.find]
where = ["src"]
