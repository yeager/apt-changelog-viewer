name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext gir1.2-adw-1 gir1.2-gtk-4.0 python3-gi xvfb
          python -m pip install --upgrade build twine
      - name: Run release sanity tests
        run: xvfb-run -a env PYTHONPATH=/usr/lib/python3/dist-packages:src /usr/bin/python3 -m unittest discover -s tests -v
      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
