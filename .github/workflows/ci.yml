name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop and localization dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper-compat dh-python gettext gir1.2-adw-1 gir1.2-gtk-4.0 pybuild-plugin-pyproject python3-all python3-gi python3-setuptools xvfb
      - name: Check Python syntax and GTK imports
        run: |
          python3 -m compileall -q src tests
          PYTHONPATH=src python3 -c "import apt_changelog_viewer.main"
      - name: Validate Swedish catalog
        run: msgfmt --check --check-format --statistics po/sv.po -o /tmp/apt-changelog-viewer.mo
      - name: Run tests
        run: xvfb-run -a env PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Build and validate PyPI distributions
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Build Debian package and verify its runtime dependencies
        run: |
          dpkg-buildpackage -us -uc -b
          package=$(find .. -maxdepth 1 -name 'apt-changelog-viewer_*_all.deb' -print -quit)
          test -n "$package"
          dpkg-deb -f "$package" Depends | grep -q 'gir1.2-adw-1'
