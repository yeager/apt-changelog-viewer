name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify tag version and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match project version {version}")
          PY
          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Install Debian build and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper-compat dh-python gettext \
            gir1.2-adw-1 gir1.2-gtk-4.0 pybuild-plugin-pyproject \
            python3-all python3-gi python3-setuptools xvfb

      - name: Validate Swedish catalog and run tests
        run: |
          msgfmt --check --check-format po/sv.po -o /tmp/apt-changelog-viewer.mo
          xvfb-run -a env PYTHONPATH=src /usr/bin/python3 -m unittest discover -s tests -v

      - name: Build and validate Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../apt-changelog-viewer_*_all.deb dist/

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Build and validate PyPI distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"
