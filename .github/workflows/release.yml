name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match project version {version}")
          PY
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install Debian build and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper-compat dh-python gettext \
            gir1.2-adw-1 gir1.2-gtk-4.0 pybuild-plugin-pyproject \
            python3-all python3-gi python3-setuptools xvfb

      - name: Validate Swedish catalog and run tests
        run: |
          msgfmt --check --check-format po/sv.po -o /tmp/apt-changelog-viewer.mo
          xvfb-run -a env PYTHONPATH=src /usr/bin/python3 -m unittest discover -s tests -v

      - name: Build and validate Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../apt-changelog-viewer_*_all.deb dist/

      - name: Build and validate PyPI distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"
